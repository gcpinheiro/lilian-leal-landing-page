<header class="container header" [class.interactive]="interactive()">
  <a class="brand" href="#inicio" aria-label="Dra. Lilian Leal — início" (click)="closeMenu('inicio')">
    <span><span class="brand-name">{{ site.name }}</span><span class="brand-field">{{ site.field }}</span></span>
  </a>
  <button type="button" class="menu-toggle" (click)="menuOpen.set(!menuOpen())"
    [attr.aria-expanded]="menuOpen()" aria-controls="navigation">
    {{ menuOpen() ? 'Fechar' : 'Menu' }} <span aria-hidden="true">{{ menuOpen() ? '×' : '+' }}</span>
  </button>
  <nav id="navigation" aria-label="Navegação principal" [class.open]="menuOpen()">
    @for (item of navigation; track item.id) {
      <a [href]="'#' + item.id" (click)="closeMenu(item.id)">{{ item.label }}</a>
    }
    <a class="nav-social" [href]="site.instagram" target="_blank" rel="noopener noreferrer">Instagram <span aria-hidden="true">↗</span><span class="sr-only"> (abre em nova aba)</span></a>
  </nav>
</header>
