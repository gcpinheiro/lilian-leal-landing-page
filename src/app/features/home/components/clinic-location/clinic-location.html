<section class="section-space" id="localizacao" tabindex="-1" aria-labelledby="location-title">
  <div class="container">
    <div class="location-heading">
      <div>
        <p class="eyebrow">Localização</p>
        <h2 id="location-title">Encontre a Clínica Otos.</h2>
        <p>A Dra. Lilian Leal atende na Aldeota, em Fortaleza.</p>
        <address>{{ clinic.address }}</address>
      </div>
      <a class="text-link" [href]="clinic.mapsUrl" target="_blank" rel="noopener noreferrer">Abrir no Google Maps<svg class="icon-arrow" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M7 17 17 7M7 7h10v10" /></svg><span class="sr-only"> (abre em nova aba)</span></a>
    </div>
    <iframe [src]="mapSource" title="Mapa da Clínica Otos — Rua Carolina Sucupira, 1151, Fortaleza" width="1200" height="460" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>
  </div>
</section>
